<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enlist Form</title>
    <link rel="stylesheet" href="main.css">
     <link rel="icon" href="images.jpg" type="image/x-icon">
      <script src="enlistForm.js" defer></script>
</head>
<body>
    <header><h1>Enlist Form</h1></header>
        <form id="enlist-form">
        <h2>Personal Information</h2>
        <input type="text" placeholder="First Name" id="fname" required> <input type="text" placeholder="Last Name" id="lname" required> <br>
        <input type="text" placeholder="Age" id="age" required> <input type="date" placeholder="Date of Birth" id="dob" required> <br>
        <input type="number" placeholder="Height (m.cm)" id="height" required> <input type="numbee" placeholder="Weight (kg.g)" id="weight" required> <br>

         <h2>Contact Information</h2>
        <input type="text" placeholder="Address" id="adr" required> <input type="text" placeholder="City" id="city" required> <br>
        <input type="text" placeholder="State" id="state" required> <input type="text" placeholder="Zip Code" id="zip" required> <br>
        <input type="email" placeholder="Email" id="email" required> <input type="tel" placeholder="Phone Number" id="phone" required> <br>
        </form>
         
    </section>
    <footer>
        <button id="recruit-submit">Submit</button>
        <p>&copy; 2023 Sigeon Pex.  All rights reserved.</p>
    </footer>
</body>
</html>
